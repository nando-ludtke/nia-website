<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIA Health | Access 142</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=DM+Sans:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background: #F9F7F2 url('nia_front.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }

    .container {
      padding: 2.5rem;
      max-width: 450px;
      width: 90%;
      text-align: center;
    }

    .logo-block {
      margin-bottom: 1rem;
    }

    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 0.1rem;
    }

    .tagline {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 400;
      color: #FFFFFF;
      margin: 0.5rem 0;
    }

    .mission-text {
      font-size: 0.9rem;
      color: #E0E0E0;
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.85rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
    }

    input[type="email"]::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      align-items: flex-start;
      background: rgba(0, 0, 0, 0.4);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .radio-group label {
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: #FFFFFF;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background-color: #A5CAD2;
      color: #1A2B3C;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #FFFFFF;
      color: #1A2B3C;
    }

    .qr-block {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-image {
      width: 120px;
      height: 120px;
      display: block;
    }

    .qr-text {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0;
      font-family: 'Outfit', sans-serif;
    }

    .qr-text a {
      color: #FFFFFF;
      text-decoration: none;
      transition: color 0.3s;
    }

    .qr-text a:hover {
      color: #A5CAD2;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo-block">
      <img src="logo_white.svg" alt="NIA Medical Logo" class="logo" />
      <p class="tagline">The bridge to mental health</p>
      <p class="mission-text">NIA eliminates the 142-day wait for mental health support with clinical-grade AI and
        on-demand
        safe spaces.</p>
    </div>

    <!-- Anonymized via Formspree Hash -->
    <form method="POST" action="https://formspree.io/f/mgvkqdpk">
      <input type="email" name="email" placeholder="Email address" required />

      <div class="radio-group">
        <label><input type="radio" name="interest" value="general interest" checked /> General Interest</label>
        <label><input type="radio" name="interest" value="clinician" /> Clinical Partnership</label>
        <label><input type="radio" name="interest" value="investor" /> Investor</label>
        <label><input type="radio" name="interest" value="join team" /> Join the Team</label>
      </div>

      <button type="submit">Join</button>
    </form>

    <div class="qr-block">
      <img src="qr_survey_white.png" alt="Mental Health Survey QR Code" class="qr-image" />
      <p class="qr-text">
        <a href="https://forms.gle/Gaavhvziasfq5Lsj7" target="_blank" rel="noopener noreferrer">Mental Health Survey</a>
      </p>
    </div>
  </div>
</body>

</html>
