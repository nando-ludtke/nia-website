<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIA Health | Access 142</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=DM+Sans:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background: #F9F7F2 url('nia_front.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1A2B3C;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .logo-block {
      margin-bottom: 2rem;
    }

    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1A2B3C;
      margin: 0.5rem 0;
    }

    .mission-text {
      font-size: 0.9rem;
      color: #4A4A4A;
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.85rem;
      margin-bottom: 1rem;
      border: 1px solid #D1D1D1;
      border-radius: 8px;
      font-size: 1rem;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      align-items: flex-start;
      background: #fdfdfd;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #f0f0f0;
    }

    .radio-group label {
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background-color: #1A2B3C;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #A5CAD2;
      color: #1A2B3C;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo-block">
      <img src="logo_black.svg" alt="NIA Medical Logo" class="logo" />
      <p class="tagline">The bridge to mental health[cite: 1]</p>
      <p class="mission-text">Eliminating the 142-day wait for psychotherapy through guideline-based AI and neutral
        safe-space cabins[cite: 1].</p>
    </div>

    <!-- Anonymized via Formspree Hash -->
    <form method="POST" action="https://formspree.io/f/mgvkqdpk">
      <input type="email" name="email" placeholder="Email address" required />

      <div class="radio-group">
        <label><input type="radio" name="interest" value="general interest" checked /> General Interest</label>
        <label><input type="radio" name="interest" value="clinician" /> Clinical Partnership (Scale 20x)[cite:
          1]</label>
        <label><input type="radio" name="interest" value="investor" /> Investor [cite: 1]</label>
        <label><input type="radio" name="interest" value="join team" /> Join the Team</label>
      </div>

      <button type="submit">Join</button>
    </form>
  </div>
</body>

</html>
